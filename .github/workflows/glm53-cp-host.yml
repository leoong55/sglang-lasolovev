name: GLM53 CP host tests
on:
  push:
    branches:
      - work/glm53-chunks-v7
      - work/glm53-dflash-v8
      - work/glm53-hicache-v9
      - work/glm53-dflash-graph-audit-v9-13
      - work/glm53-cancel-v9-14
  pull_request:
    paths:
      - deploy/glm53-chunks-v7/**
      - deploy/glm53-dflash-v8/**
      - deploy/glm53-hicache-v9/**
      - .github/workflows/glm53-cp-host.yml
      - python/sglang/srt/managers/tokenizer_manager.py
      - python/sglang/srt/entrypoints/openai/serving_chat.py
permissions:
  contents: read
concurrency:
  group: glm53-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cancel:
    if: github.ref == 'refs/heads/work/glm53-cancel-v9-14' || github.head_ref == 'work/glm53-cancel-v9-14'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ASGI test dependencies
        run: python -m pip install starlette==0.48.0 anyio==4.10.0
      - name: Run cancellation and installer regressions
        env:
          SGLANG_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          python -m unittest discover -s deploy/glm53-hicache-v9/tests -p 'test_host_cancel*.py' -v
          python -m unittest discover -s deploy/glm53-hicache-v9/tests -p 'test_host_install.py' -v
      - name: Assemble checksummed source build kit
        run: |
          git fetch --no-tags --depth=1 origin \
            0bcd822377da7b5718e674eaf9c870d349424dd1 \
            6526bef6bf959e203a0cc23dacdb2553f81c1e3e \
            1f1171df23c98755c7d479d8befe071a9e13ecbe \
            3e2b2c5c5176fbf665631b6a1f4961b337707965 \
            ca6f232142316e660c2defc3b1ee2b4ddc197818
          python deploy/glm53-hicache-v9/make_bundle.py "$RUNNER_TEMP/glm53-hicache-v9.14"
          cd "$RUNNER_TEMP/glm53-hicache-v9.14"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: glm53-hicache-v9.14-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/glm53-hicache-v9.14.tar.gz
          if-no-files-found: error
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install triton==3.1.0 numpy==1.26.4 regex safetensors cuda-bindings nvidia-ml-py tqdm tabulate
          python -m pip install --no-deps humming-kernels==0.1.12
          python -m pip install starlette==0.48.0 anyio==4.10.0
      - name: Run host tests
        env:
          SGLANG_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          # Historical kits assert historical contracts (e.g. v7 forbids the
          # padding introduced in v9.10). The newest kit carries their updated
          # tests for the current source; do not run old expectations on HEAD.
          for kit in deploy/glm53-hicache-v9 deploy/glm53-dflash-v8 deploy/glm53-chunks-v7; do
            if [ -d "$kit" ]; then
              python -m unittest discover -s "$kit/tests" -p 'test_host*.py' -v
              python -m unittest discover -s "$kit/tests" -p 'test_chunk*.py' -v
              exit 0
            fi
          done
          echo 'No GLM53 test kit found' >&2
          exit 1
      - name: Install Triton interpreter dependencies
        if: hashFiles('deploy/glm53-dflash-v8/tests/test_kernel_verify.py') != ''
        run: python -m pip install triton==3.1.0 numpy==1.26.4
      - name: Check actual verify-index kernel with CPU interpreter
        if: hashFiles('deploy/glm53-dflash-v8/tests/test_kernel_verify.py') != ''
        env:
          TRITON_INTERPRET: '1'
          SGLANG_SOURCE_ROOT: ${{ github.workspace }}
        run: python deploy/glm53-dflash-v8/tests/test_kernel_verify.py -v
      - name: Compile CP/DCP bridge kernels to H200 cubins without GPU
        if: hashFiles('deploy/glm53-hicache-v9/kernel_preflight.py') != ''
        run: python deploy/glm53-hicache-v9/kernel_preflight.py --package-root python/sglang
      - name: Check actual CP split kernel and both callers
        if: hashFiles('deploy/glm53-hicache-v9/tests/test_kernel_cp_split.py') != ''
        env:
          TRITON_INTERPRET: '1'
          SGLANG_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          python deploy/glm53-hicache-v9/tests/test_kernel_cp_split.py -v
          python deploy/glm53-hicache-v9/tests/test_kernel_lse.py -v
          python deploy/glm53-hicache-v9/tests/test_kernel_verify.py -v
