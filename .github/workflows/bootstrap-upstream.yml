name: Stage pinned SGLang upstream

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-upstream.yml]

permissions:
  contents: write

concurrency:
  group: bootstrap-upstream
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'leoong55/sglang-lasolovev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 0bcd822377da7b5718e674eaf9c870d349424dd1
    steps:
      - name: Stage source and history without active workflow files
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          gh auth setup-git
          git init transfer.git
          cd transfer.git
          git remote add origin https://github.com/leoong55/sglang-lasolovev.git
          git remote add upstream https://github.com/sgl-project/sglang.git
          git fetch upstream "$TARGET_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          git read-tree "$TARGET_SHA"
          git ls-tree -r --name-only "$TARGET_SHA" .github/workflows |
            git update-index --force-remove --stdin
          STAGING_TREE="$(git write-tree)"
          test -z "$(git ls-tree -r --name-only "$STAGING_TREE" .github/workflows)"
          STAGING_SHA="$(echo 'Stage upstream source; workflow restoration requires the authorized connector' |
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit-tree "$STAGING_TREE" -p "$TARGET_SHA")"
          git push origin \
            --force-with-lease="refs/heads/codex/import-upstream:" \
            "$STAGING_SHA:refs/heads/codex/import-upstream"
          echo "Staging commit: $STAGING_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Original upstream commit: $TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
