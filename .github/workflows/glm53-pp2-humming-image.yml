name: GLM53 PP2 Humming image

on:
  pull_request:
    branches: [work/glm53-stg-pp2-dpa]
    paths:
      - deploy/glm53-pp2-humming-v1/**
      - python/sglang/srt/layers/quantization/w4afp8.py
      - python/sglang/srt/layers/quantization/w4afp8_humming.py
      - python/sglang/srt/layers/moe/moe_runner/humming.py
      - .github/workflows/glm53-pp2-humming-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glm53-pp2-humming-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate deployment, source manifest and installer
        run: |
          python3 -m pip install PyYAML
          python3 -m unittest discover -s deploy/glm53-pp2-humming-v1/tests -p 'test_host_*.py' -v
      - name: Make room for the CUDA base image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source and image tag
        id: meta
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:glm53-pp2-humming-v1-${commit:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build, check Humming on CPU, and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/glm53-pp2-humming-v1/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            SOURCE_COMMIT=${{ steps.meta.outputs.commit }}
          provenance: mode=max
      - name: Record image and render deployment
        env:
          PP2_IMAGE: ${{ steps.meta.outputs.image }}
          PP2_DIGEST: ${{ steps.build.outputs.digest }}
          PP2_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          python3 deploy/glm53-pp2-humming-v1/render.py --image "$PP2_IMAGE@$PP2_DIGEST" > deployment.yaml
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {key: os.environ['PP2_' + key.upper()] for key in ('image', 'digest', 'commit')}
          data['gpu_validated'] = False
          Path('image.json').write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Image: `{data['image']}@{data['digest']}`\n\nSource: `{data['commit']}`\n\nGPU execution has not been validated.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glm53-pp2-humming-image
          path: |
            image.json
            deployment.yaml
