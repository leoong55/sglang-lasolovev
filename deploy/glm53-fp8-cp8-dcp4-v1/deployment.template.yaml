apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-glm53-fp8-dcp4
  namespace: inf-glm53
spec:
  progressDeadlineSeconds: 7200
  replicas: 1
  selector:
    matchLabels:
      app: sglang-glm53-fp8-dcp4
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sglang-glm53-fp8-dcp4
        runtime-sglang/metrics: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
        glm53-test-profile: fp8-cp8-dcp4-v1-c40-dflash8
    spec:
      containers:
      - args:
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --trust-remote-code
        - --tp-size
        - '8'
        - --ep-size
        - '8'
        - --dp-size
        - '1'
        - --enable-prefill-cp
        - --cp-strategy
        - interleave
        - --enable-cp-decode-attn-tp
        - --dcp-size
        - '4'
        - --dcp-comm-backend
        - ag_rs
        - --moe-a2a-backend
        - none
        - --kv-cache-dtype
        - fp8_e4m3
        - --dsa-prefill-backend
        - flashmla_sparse_q8
        - --dsa-decode-backend
        - flashmla_kv
        - --page-size
        - '64'
        - --chunked-prefill-size
        - '16384'
        - --prefill-decode-interval
        - '1'
        - --cuda-graph-backend-prefill
        - breakable
        - --cuda-graph-max-bs-prefill
        - '16384'
        - --cuda-graph-bs-prefill
        - '8192'
        - '16384'
        - --cuda-graph-backend-decode
        - full
        - --enable-hierarchical-cache
        - --hicache-write-policy
        - write_through
        - --hicache-io-backend
        - direct
        - --hicache-mem-layout
        - layer_first
        - --hicache-host-memory-mode
        - cache
        - --reasoning-parser
        - glm45
        - --tool-call-parser
        - glm47
        - --enable-metrics
        - --enable-cache-report
        - --glm53-cp-decode-fusion
        - 'off'
        - --enforce-disable-flashinfer-allreduce-fusion
        - --glm53-profile
        - cp8-dcp4
        - --glm53-draft-cache-window
        - '2048'
        - --speculative-algorithm
        - DFLASH
        - --speculative-draft-model-path
        - incoai/GLM-5.3-DFlash2
        - --speculative-draft-model-quantization
        - unquant
        - --speculative-draft-attention-backend
        - fa4
        - --speculative-dflash-block-size
        - '8'
        - --glm53-dflash-graph-policy
        - warn
        - --model-path
        - /mnt/model-pvc-fp8
        - --served-model-name
        - alpha-fm
        - --mem-fraction-static
        - '0.78'
        - --max-running-requests
        - '40'
        - --cuda-graph-max-bs-decode
        - '40'
        - --hicache-size
        - '96'
        - --default-chat-template-kwargs
        - '{"reasoning_effort":"low"}'
        - --cuda-graph-bs-decode
        - '1'
        - '2'
        - '4'
        - '8'
        - '16'
        - '32'
        - '40'
        command:
        - python3
        - /opt/glm53-fp8-cp8-dcp4/fp8/launch_fp8.py
        env:
        - name: SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION
          value: '0.05'
        - name: CUDA_DISABLE_CONTROL
          value: 'true'
        - name: SGLANG_ENABLE_CP_V2
          value: '1'
        - name: SGLANG_DSA_FUSE_TOPK
          value: '0'
        - name: SGLANG_GLM53_PREFILL_BCG
          value: '1'
        - name: SGLANG_GLM53_DFLASH_DCP
          value: '1'
        - name: SGLANG_GLM53_HICACHE_DCP
          value: '1'
        - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
          value: '1'
        - name: SGLANG_CACHE_DIR
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/sglang
        - name: SGLANG_DG_CACHE_DIR
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/deepgemm
        - name: DG_JIT_CACHE_DIR
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/deepgemm
        - name: TRITON_CACHE_DIR
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/triton
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/torchinductor
        - name: TORCH_EXTENSIONS_DIR
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/torch-extensions
        - name: CUDA_CACHE_PATH
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/cuda
        - name: HF_HOME
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/huggingface
        - name: XDG_CACHE_HOME
          value: /mnt/cache/glm53-fp8-cp8-dcp4-v1/xdg
        - name: SGLANG_GLM53_CP_DECODE_FUSION
          value: '0'
        - name: SGLANG_GLM53_DRAFT_CACHE_WINDOW
          value: '2048'
        - name: SGLANG_GLM53_BOUNDED_DRAFT_FASTPATH
          value: '1'
        - name: SGLANG_GLM53_PREFILL_BCG_PADDING
          value: '1'
        image: REPLACE_WITH_FP8_IMAGE_DIGEST
        imagePullPolicy: IfNotPresent
        name: sglang
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
          requests:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
        startupProbe:
          failureThreshold: 720
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /mnt/model-pvc-fp8
          name: model
          readOnly: true
        - mountPath: /mnt/cache
          name: compile-cache
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: harbor-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: sglang-fp8-pvc
      - name: compile-cache
        persistentVolumeClaim:
          claimName: sglang-glm53-dcp4-compile-cache
      - emptyDir:
          medium: Memory
          sizeLimit: 32Gi
        name: shm
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-glm53-fp8-dcp4
  namespace: inf-glm53
spec:
  selector:
    app: sglang-glm53-fp8-dcp4
  ports:
  - name: http
    port: 8080
    targetPort: http
