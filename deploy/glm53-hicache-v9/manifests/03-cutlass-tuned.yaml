apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-glm53-dcp4
  namespace: inf-glm53
spec:
  progressDeadlineSeconds: 7200
  replicas: 1
  selector:
    matchLabels:
      app: sglang-glm53-dcp4
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sglang-glm53-dcp4
        runtime-sglang/metrics: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
        glm53-test-profile: v9.11.1-cp8-dcp4-cutlass-tuned
    spec:
      containers:
      - args:
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --model-path
        - /mnt/model-pvc-w4fp8
        - --served-model-name
        - GLM-5.3
        - --trust-remote-code
        - --tp-size
        - '8'
        - --ep-size
        - '8'
        - --dp-size
        - '1'
        - --enable-prefill-cp
        - --cp-strategy
        - interleave
        - --enable-cp-decode-attn-tp
        - --dcp-size
        - '4'
        - --dcp-comm-backend
        - ag_rs
        - --moe-a2a-backend
        - none
        - --quantization
        - w4afp8
        - --kv-cache-dtype
        - fp8_e4m3
        - --dsa-prefill-backend
        - flashmla_sparse_q8
        - --dsa-decode-backend
        - flashmla_kv
        - --disable-shared-experts-fusion
        - --page-size
        - '64'
        - --mem-fraction-static
        - '0.80'
        - --max-running-requests
        - '48'
        - --chunked-prefill-size
        - '16384'
        - --prefill-decode-interval
        - '1'
        - --cuda-graph-backend-prefill
        - breakable
        - --cuda-graph-max-bs-prefill
        - '16384'
        - --cuda-graph-bs-prefill
        - '8192'
        - '16384'
        - --cuda-graph-backend-decode
        - full
        - --cuda-graph-max-bs-decode
        - '48'
        - --cuda-graph-bs-decode
        - '1'
        - '2'
        - '4'
        - '8'
        - '16'
        - '32'
        - '40'
        - '48'
        - --enable-hierarchical-cache
        - --hicache-write-policy
        - write_through
        - --hicache-io-backend
        - direct
        - --hicache-mem-layout
        - layer_first
        - --hicache-host-memory-mode
        - cache
        - --hicache-ratio
        - '1.0'
        - --reasoning-parser
        - glm45
        - --tool-call-parser
        - glm47
        - --enable-metrics
        - --enable-cache-report
        - --glm53-cp-decode-fusion
        - 'off'
        - --enforce-disable-flashinfer-allreduce-fusion
        - --moe-runner-backend
        - cutlass
        command:
        - python3
        - /opt/glm53-cp8-dcp4-v1/launch.py
        env:
        - name: CUDA_DISABLE_CONTROL
          value: 'true'
        - name: SGLANG_ENABLE_CP_V2
          value: '1'
        - name: SGLANG_DSA_FUSE_TOPK
          value: '0'
        - name: SGLANG_GLM53_PREFILL_BCG
          value: '1'
        - name: SGLANG_GLM53_DFLASH_DCP
          value: '0'
        - name: SGLANG_GLM53_HICACHE_DCP
          value: '1'
        - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
          value: '1'
        - name: SGLANG_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/sglang
        - name: SGLANG_DG_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/deepgemm
        - name: DG_JIT_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/deepgemm
        - name: TRITON_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/triton
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/torchinductor
        - name: TORCH_EXTENSIONS_DIR
          value: /mnt/cache/glm53-dcp4-v1/torch-extensions
        - name: CUDA_CACHE_PATH
          value: /mnt/cache/glm53-dcp4-v1/cuda
        - name: HF_HOME
          value: /mnt/cache/glm53-dcp4-v1/huggingface
        - name: XDG_CACHE_HOME
          value: /mnt/cache/glm53-dcp4-v1/xdg
        - name: SGLANG_GLM53_CP_DECODE_FUSION
          value: '0'
        - name: SGLANG_GLM53_DRAFT_CACHE_WINDOW
          value: '0'
        - name: SGLANG_GLM53_BOUNDED_DRAFT_FASTPATH
          value: '0'
        - name: SGLANG_HUMMING_MOE_GEMM_TYPE
          value: indexed
        - name: SGLANG_HUMMING_USE_F16_ACCUM
          value: '0'
        - name: HUMMING_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/humming
        - name: SGLANG_GLM53_CUTLASS_CONFIG
          value: /mnt/cache/glm53-cutlass-tuning.json
        image: i501-harbor-infra.ai.turbocloud.ru/images/lmsysorg/sglang:glm53-hicache-v9.11.1-0bcd822377da
        imagePullPolicy: IfNotPresent
        name: sglang
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
          requests:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
        startupProbe:
          failureThreshold: 720
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /mnt/model-pvc-w4fp8
          name: model
          readOnly: true
        - mountPath: /mnt/cache
          name: compile-cache
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: harbor-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: sglang-w4fp8-pvc
      - name: compile-cache
        persistentVolumeClaim:
          claimName: sglang-glm53-dcp4-compile-cache
      - emptyDir:
          medium: Memory
          sizeLimit: 32Gi
        name: shm
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - i501-infcp-prod-k8s-w06
