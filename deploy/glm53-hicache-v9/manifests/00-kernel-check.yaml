apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-glm53-dcp4
  namespace: inf-glm53
spec:
  progressDeadlineSeconds: 7200
  replicas: 1
  selector:
    matchLabels:
      app: sglang-glm53-dcp4
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sglang-glm53-dcp4
      annotations:
        glm53-test-profile: v9.10-w4-component-check
    spec:
      containers:
      - command:
        - sleep
        - infinity
        env:
        - name: CUDA_DISABLE_CONTROL
          value: 'true'
        - name: SGLANG_ENABLE_CP_V2
          value: '1'
        - name: SGLANG_DSA_FUSE_TOPK
          value: '0'
        - name: SGLANG_GLM53_PREFILL_BCG
          value: '1'
        - name: SGLANG_GLM53_DFLASH_DCP
          value: '0'
        - name: SGLANG_GLM53_HICACHE_DCP
          value: '1'
        - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
          value: '1'
        - name: SGLANG_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/sglang
        - name: SGLANG_DG_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/deepgemm
        - name: DG_JIT_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/deepgemm
        - name: TRITON_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/triton
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/torchinductor
        - name: TORCH_EXTENSIONS_DIR
          value: /mnt/cache/glm53-dcp4-v1/torch-extensions
        - name: CUDA_CACHE_PATH
          value: /mnt/cache/glm53-dcp4-v1/cuda
        - name: HF_HOME
          value: /mnt/cache/glm53-dcp4-v1/huggingface
        - name: XDG_CACHE_HOME
          value: /mnt/cache/glm53-dcp4-v1/xdg
        - name: SGLANG_GLM53_CP_DECODE_FUSION
          value: '0'
        - name: SGLANG_GLM53_DRAFT_CACHE_WINDOW
          value: '0'
        - name: SGLANG_GLM53_BOUNDED_DRAFT_FASTPATH
          value: '0'
        - name: SGLANG_HUMMING_MOE_GEMM_TYPE
          value: indexed
        - name: SGLANG_HUMMING_USE_F16_ACCUM
          value: '0'
        - name: HUMMING_CACHE_DIR
          value: /mnt/cache/glm53-dcp4-v1/humming
        image: i501-harbor-infra.ai.turbocloud.ru/images/lmsysorg/sglang:glm53-hicache-v9.10-0bcd822377da
        imagePullPolicy: IfNotPresent
        name: sglang
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
          requests:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /mnt/model-pvc-w4fp8
          name: model
          readOnly: true
        - mountPath: /mnt/cache
          name: compile-cache
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: harbor-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: sglang-w4fp8-pvc
      - name: compile-cache
        persistentVolumeClaim:
          claimName: sglang-glm53-dcp4-compile-cache
      - emptyDir:
          medium: Memory
          sizeLimit: 32Gi
        name: shm
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - i501-infcp-prod-k8s-w06
