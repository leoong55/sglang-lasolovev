apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-glm53-h200-ab
  namespace: inf-glm53
spec:
  progressDeadlineSeconds: 7200
  replicas: 1
  selector:
    matchLabels:
      app: sglang-glm53-h200-ab
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sglang-glm53-h200-ab
        runtime-sglang/metrics: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
        glm53-test-profile: render-required
    spec:
      containers:
      - args: []
        command:
        - python3
        - /opt/glm53-h200-ab/h200/launch.py
        env:
        - name: SGLANG_DSA_FUSE_TOPK
          value: '0'
        - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
          value: '1'
        - name: SGLANG_CACHE_DIR
          value: /mnt/cache/glm53-h200-ab/sglang
        - name: SGLANG_DG_CACHE_DIR
          value: /mnt/cache/glm53-h200-ab/deepgemm
        - name: DG_JIT_CACHE_DIR
          value: /mnt/cache/glm53-h200-ab/deepgemm
        - name: TRITON_CACHE_DIR
          value: /mnt/cache/glm53-h200-ab/triton
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /mnt/cache/glm53-h200-ab/torchinductor
        - name: CUDA_CACHE_PATH
          value: /mnt/cache/glm53-h200-ab/cuda
        - name: HF_HOME
          value: /mnt/cache/glm53-h200-ab/huggingface
        - name: XDG_CACHE_HOME
          value: /mnt/cache/glm53-h200-ab/xdg
        - name: SGLANG_HUMMING_MOE_GEMM_TYPE
          value: indexed
        - name: SGLANG_HUMMING_USE_F16_ACCUM
          value: '0'
        - name: HUMMING_CACHE_DIR
          value: /mnt/cache/glm53-h200-ab/humming
        - name: SGLANG_GLM53_HUMMING_EP_AWARE
          value: '1'
        image: RENDER_WITH_IMMUTABLE_IMAGE
        imagePullPolicy: IfNotPresent
        name: sglang
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
          requests:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
        startupProbe:
          failureThreshold: 720
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /mnt/model-pvc-w4fp8
          name: model
          readOnly: true
        - mountPath: /mnt/cache
          name: compile-cache
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: harbor-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: sglang-w4fp8-pvc
      - name: compile-cache
        emptyDir: {}
      - emptyDir:
          medium: Memory
          sizeLimit: 32Gi
        name: shm
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - i501-infcp-prod-k8s-w06
