apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-glm53-dcp4
  namespace: inf-glm53
spec:
  progressDeadlineSeconds: 7200
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sglang-glm53-dcp4
  template:
    metadata:
      labels:
        app: sglang-glm53-dcp4
        runtime-sglang/metrics: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
        glm53-test-profile: pp2-humming-v1-tp4-ep4-bcg16384
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
      - name: harbor-pull
      containers:
      - name: sglang
        image: REPLACE_WITH_PP2_HUMMING_IMAGE
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /opt/glm53-pp2-humming-v1/launch.py
        args:
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --model-path
        - /mnt/model-pvc-w4fp8
        - --served-model-name
        - GLM-5.3
        - --trust-remote-code
        - --tp-size
        - '4'
        - --pp-size
        - '2'
        - --ep-size
        - '4'
        - --dp-size
        - '1'
        - --attn-cp-size
        - '1'
        - --dcp-size
        - '1'
        - --moe-dp-size
        - '1'
        - --pp-max-micro-batch-size
        - '24'
        - --pp-async-batch-depth
        - '0'
        - --disable-overlap-schedule
        - --moe-a2a-backend
        - none
        - --moe-runner-backend
        - humming
        - --quantization
        - w4afp8
        - --kv-cache-dtype
        - fp8_e4m3
        - --attention-backend
        - dsa
        - --dsa-prefill-backend
        - flashmla_kv
        - --dsa-decode-backend
        - flashmla_kv
        - --disable-shared-experts-fusion
        - --page-size
        - '64'
        - --mem-fraction-static
        - '0.80'
        - --context-length
        - '98304'
        - --max-running-requests
        - '48'
        - --chunked-prefill-size
        - '16384'
        - --prefill-decode-interval
        - '1'
        - --cuda-graph-backend-prefill
        - breakable
        - --cuda-graph-max-bs-prefill
        - '16384'
        - --cuda-graph-bs-prefill
        - '512'
        - '1024'
        - '2048'
        - '4096'
        - '8192'
        - '16384'
        - --cuda-graph-backend-decode
        - full
        - --cuda-graph-max-bs-decode
        - '24'
        - --cuda-graph-bs-decode
        - '1'
        - '2'
        - '4'
        - '8'
        - '12'
        - '16'
        - '20'
        - '24'
        - --enforce-disable-flashinfer-allreduce-fusion
        - --random-seed
        - '0'
        - --reasoning-parser
        - glm45
        - --tool-call-parser
        - glm47
        - --enable-metrics
        - --enable-metrics-for-all-schedulers
        - --enable-cache-report
        env:
        - name: SGLANG_PP_LAYER_PARTITION
          value: 39,39
        - name: SGLANG_ENABLE_CP_V2
          value: '0'
        - name: SGLANG_DSA_FUSE_TOPK
          value: '0'
        - name: SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION
          value: '0.05'
        - name: CUDA_DISABLE_CONTROL
          value: 'true'
        - name: SGLANG_HUMMING_MOE_GEMM_TYPE
          value: indexed
        - name: SGLANG_HUMMING_USE_F16_ACCUM
          value: '0'
        - name: SGLANG_GLM53_HUMMING_EP_AWARE
          value: '1'
        - name: SGLANG_CACHE_DIR
          value: /mnt/cache/glm53-pp2-humming-v1/sglang
        - name: SGLANG_DG_CACHE_DIR
          value: /mnt/cache/glm53-pp2-humming-v1/deepgemm
        - name: DG_JIT_CACHE_DIR
          value: /mnt/cache/glm53-pp2-humming-v1/deepgemm
        - name: TRITON_CACHE_DIR
          value: /mnt/cache/glm53-pp2-humming-v1/triton
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /mnt/cache/glm53-pp2-humming-v1/torchinductor
        - name: TORCH_EXTENSIONS_DIR
          value: /mnt/cache/glm53-pp2-humming-v1/torch-extensions
        - name: CUDA_CACHE_PATH
          value: /mnt/cache/glm53-pp2-humming-v1/cuda
        - name: HF_HOME
          value: /mnt/cache/glm53-pp2-humming-v1/huggingface
        - name: XDG_CACHE_HOME
          value: /mnt/cache/glm53-pp2-humming-v1/xdg
        - name: HUMMING_CACHE_DIR
          value: /mnt/cache/glm53-pp2-humming-v1/humming
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
          limits:
            cpu: '112'
            memory: 1536Gi
            nvidia.com/gpu: '8'
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 720
        readinessProbe:
          httpGet:
            path: /model_info
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: model
          mountPath: /mnt/model-pvc-w4fp8
          readOnly: true
        - name: compile-cache
          mountPath: /mnt/cache
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: sglang-w4fp8-pvc
      - name: compile-cache
        persistentVolumeClaim:
          claimName: sglang-glm53-dcp4-compile-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-glm53-dcp4
  namespace: inf-glm53
spec:
  type: ClusterIP
  selector:
    app: sglang-glm53-dcp4
  ports:
  - name: http
    port: 8080
    targetPort: http
